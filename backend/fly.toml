# Fly.io config for the Estimoto Leads CRM backend.
#
# One-time setup (run from backend/):
#   fly launch --no-deploy --copy-config --name estimoto-leads-crm
#   fly volumes create crm_data --size 1 --region den
#   fly secrets set JWT_SECRET=... ADMIN_EMAIL=... ADMIN_PASSWORD=... \
#     ANTHROPIC_API_KEY=... GOOGLE_OAUTH_CLIENT_ID=... GOOGLE_OAUTH_CLIENT_SECRET=... \
#     GOOGLE_OAUTH_REDIRECT_URL=https://estimoto-leads-crm.fly.dev/api/gmail/callback \
#     FRONTEND_URL=https://<your-vercel-domain> \
#     CORS_ORIGINS=https://<your-vercel-domain>
#   fly deploy
#
# The SQLite database lives on the mounted volume, which is why this app is
# pinned to a single machine (no horizontal scaling without moving to Postgres).

app = "estimoto-leads-crm"
primary_region = "den"

[build]

[env]
  DATABASE_URL = "sqlite+aiosqlite:////data/crm.db"

[mounts]
  source = "crm_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # The mail poller must keep running, so never stop the machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
